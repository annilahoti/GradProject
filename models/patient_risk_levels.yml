version: 2

models:
  - name: patient_risk_levels
    description: "Assigns each patient a risk level based on age and medical condition."
    columns: 
      - name: Name
        tests:
          - not_null
      - name: Age
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 120
      - name: risk_level
        description: "High/Medium/Low risk classification"
        tests:
          - not_null